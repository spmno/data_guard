name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 测试
        run: cargo test --all

  gui:
    name: GUI (NSH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            gui

      # NSH 的 Linux 后端需要 GTK 4.14+（ubuntu-24.04 的 libgtk-4-dev 满足）
      - name: 安装 GTK 4
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev

      - name: 格式检查
        run: cargo fmt --manifest-path gui/Cargo.toml --all --check

      - name: Clippy
        run: cargo clippy --manifest-path gui/Cargo.toml --all-targets -- -D warnings

      - name: 无头端到端测试
        run: cargo test --manifest-path gui/Cargo.toml
