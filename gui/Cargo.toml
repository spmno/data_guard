[package]
name = "data-guard-gui"
version = "0.1.0"
edition = "2024"
description = "data_guard 的图形界面（NSH / Native Shell）"
publish = false

# 独立的 workspace：根目录的 data_guard 核心库以 path 依赖引入，
# `cargo test`（根目录）只测核心，不编译 GUI 与 GTK 依赖。
[workspace]

[dependencies]
data_guard = { path = ".." }
nsh-core = "0.5.1"
nsh-base = "0.5.1"
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.5.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.5.1", default-features = false }

[dev-dependencies]
nsh-engine = "0.5.1"
nsh-testing = "0.5.1"
