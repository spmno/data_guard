[package]
name = "data_guard"
version = "0.1.0"
edition = "2024"
description = "Parquet 数据质量诊断工具"

[features]
default = []
# 图形界面（开发中，尚未接入编译）
gui = ["dep:gpui"]

[dependencies]
anyhow = "1.0"
arrow = "58"
clap = { version = "4", features = ["derive"] }
parquet = "58"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.gpui]
git = "https://github.com/zed-industries/zed"
optional = true
